<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropico 6 Production Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-container">
        <h1>Tropico 6 Production Planner</h1>

        <!-- New UI for chain configuration -->
        <div id="chain-config-area">
            <div>
                <label for="final-product-quantity">Desired quantity of final product (per day):</label>
                <input type="number" id="final-product-quantity" value="1" min="1">
            </div>
            <h2>Select Final Product:</h2>
            <div id="end-product-selection-buttons">
                <!-- Buttons for each unique output good will be populated here -->
            </div>
            <div id="chain-steps-container">
                <!-- Subsequent choices for the chain will appear here -->
            </div>
            <button id="calculate-chain-button" style="margin-top: 20px; padding: 10px;">Calculate Full Chain</button>
        </div>
        <div id="calculation-results-area">
             <!-- Results will be displayed here, replacing old output-section -->
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
